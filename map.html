</head>

        <circle cx="16" cy="16" r="9.5" stroke="#35D6E5" stroke-width="1.4" opacity="0.6"/>

    <div class="nav-links">
      <a href="index.html" class="nav-link">Overview</a>

    <div class="nav-meta">

<div class="map-shell">
  <div id="map"></div>

  <div class="card map-overlay-panel">
    <div class="region-eyebrow">MANGALURU REGION</div>
    <div style="font-size:15px; font-weight:700; margin-top:4px;">6 monitored locations</div>
    <div style="font-size:12px; color: var(--text-tertiary); margin-top:4px;">Tap a marker for live readings</div>
  </div>

  <div class="card map-legend">
    <div class="map-legend-row"><span class="legend-swatch" style="background:#4ad991;"></span>Good</div>
    <div class="map-legend-row"><span class="legend-swatch" style="background:#e8c94a;"></span>Moderate</div>
    <div class="map-legend-row"><span class="legend-swatch" style="background:#f0973d;"></span>Sensitive</div>
    <div class="map-legend-row"><span class="legend-swatch" style="background:#ec5b52;"></span>Unhealthy</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.__aerisInitGauge = false;</script>
<script src="script.js"></script>
<script>
  const LOCATIONS = [
    { name: "Pilikula", aqi: 42, lat: 12.9370, lng: 74.8590 },
    { name: "Kadri", aqi: 71, lat: 12.8850, lng: 74.8480 },
    { name: "Hampankatta", aqi: 82, lat: 12.8698, lng: 74.8420 },
    { name: "Kottara", aqi: 104, lat: 12.9010, lng: 74.8360 },
    { name: "Urwa", aqi: 58, lat: 12.8790, lng: 74.8570 },
    { name: "Bejai", aqi: 65, lat: 12.8960, lng: 74.8500 },
  ];

  function categoryHex(aqi) {
    if (aqi <= 50) return "#4ad991";
    if (aqi <= 100) return "#e8c94a";
    if (aqi <= 150) return "#f0973d";
    if (aqi <= 200) return "#ec5b52";
    if (aqi <= 300) return "#b169e8";
    return "#a9695a";
  }

  const map = L.map("map", {
    zoomControl: false,
    attributionControl: true,
  }).setView([12.8920, 74.8480], 13);

  L.control.zoom({ position: "bottomright" }).addTo(map);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: "abcd",
    maxZoom: 19,
  }).addTo(map);

  LOCATIONS.forEach((loc) => {
    const color = categoryHex(loc.aqi);
    const icon = L.divIcon({
      className: "",
      html: `<div class="aqi-marker" style="background:${color};">${loc.aqi}</div>`,
      iconSize: [38, 38],
      iconAnchor: [19, 19],
    });
    const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(map);
    marker.bindPopup(
      `<strong style="font-size:13px;">${loc.name}</strong><br/><span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:${color};">AQI ${loc.aqi}</span>`
    );
    marker.on("click", () => {
      window.location.href = "locations.html";
    });
  });
</script>
</body>
</html>
